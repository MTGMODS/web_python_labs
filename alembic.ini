# Конфігурація Alembic.
# Рядок підключення тут навмисно не задається: env.py бере DATABASE_URL
# з налаштувань застосунку (файл .env), щоб мати єдине джерело правди.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os

# Автогенеровані міграції одразу форматуються black,
# щоб вони не блокували pre-commit хуки.
[post_write_hooks]
hooks = black
black.type = console_scripts
black.entrypoint = black
black.options = -l 100 REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
