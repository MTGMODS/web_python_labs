{% extends "base.html" %}
{% block title %}Реєстрація{% endblock %}

{% block content %}
<h1>Реєстрація пасажира</h1>
<form method="post" action="/register" class="card">
    <label>
        Ім'я та прізвище
        <input type="text" name="full_name" value="{{ full_name or '' }}" minlength="2" required autofocus>
    </label>
    <label>
        Email
        <input type="email" name="email" value="{{ email or '' }}" required>
    </label>
    <label>
        Пароль (мінімум 8 символів)
        <input type="password" name="password" minlength="8" required>
    </label>
    <button type="submit">Зареєструватися</button>
</form>
<p class="muted">Адміністратора через сайт створити не можна — лише скриптом наповнення.</p>
{% endblock %}
